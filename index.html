<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>大屋圖 · 三维场景</title>
<meta name="description" content="沿着瀑布，走近山水之中一栋木楼的日常。可绕转观察的三维淡墨场景。">
<style>:root {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
  color: #39332b;
  background: #ece6db;
  color-scheme: light;
  font-synthesis: none;
  --muted: #6e6255;
  --edge: clamp(10px, 1.3vmin, 18px);
  --control-surface: #f3ede3f2;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
:where(button, summary, canvas):focus-visible { outline: 2px solid #9b6b38; outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  background: #ece6db;
}
.stage:fullscreen { width: 100%; height: 100%; }
.viewport { position: absolute; inset: 0; }
.scene-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.scene-canvas:active { cursor: grabbing; }
.scene-canvas:focus-visible { outline-offset: -3px; }
.follow-panel, .toolstrip, .more-actions, .reference button {
  border: 1px solid #b9ab97;
  border-radius: 7px;
  background: var(--control-surface);
  box-shadow: 0 2px 8px #534c3b18;
}
.follow-panel {
  position: absolute;
  left: max(var(--edge), env(safe-area-inset-left));
  bottom: max(var(--edge), env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 7px 9px 7px 11px;
}
.follow-panel strong, .follow-panel span { display: block; line-height: 1.4; }
.follow-panel span { font-size: .77rem; color: var(--muted); }
.follow-panel button { padding: 6px 8px; border: 1px solid #c5b9a6; border-radius: 4px; background: #e8ddcc; white-space: nowrap; }
.loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  grid-auto-flow: column;
  align-items: center;
  gap: 12px;
  padding: 24px;
  color: #544739;
  background: #eee7db;
}
.spinner { width: 18px; height: 18px; border: 2px solid #c9bba7; border-top-color: #77634c; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toolstrip {
  position: absolute;
  z-index: 1;
  display: flex;
  gap: 2px;
  right: max(var(--edge), env(safe-area-inset-right));
  bottom: max(var(--edge), env(safe-area-inset-bottom));
  padding: 3px;
}
.viewport:not(.ready) ~ .toolstrip { visibility: hidden; }
.toolstrip button, .more summary {
  display: grid;
  place-items: center;
  min-height: 40px;
  padding: 0 10px;
  border-radius: 4px;
  background: transparent;
  font-size: .87rem;
  white-space: nowrap;
}
.toolstrip button:hover, .more summary:hover, .more[open] summary { background: #ebe1d2; }
.toolstrip button[aria-pressed="true"] { background: #e2d4c0; color: #30271f; }
.more summary { list-style: none; cursor: pointer; }
.more summary::-webkit-details-marker { display: none; }
.toolstrip #pause, .more summary { width: 40px; padding: 0; }
.more-actions {
  position: absolute;
  right: 0;
  bottom: calc(100% + 6px);
  min-width: 116px;
  padding: 3px;
}
.more-actions button { width: 100%; justify-items: start; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.icon-play, #pause[aria-pressed="true"] .icon-pause { display: none; }
#pause[aria-pressed="true"] .icon-play { display: block; }
.reference {
  position: absolute;
  z-index: 3;
  inset: 0;
  display: grid;
  place-items: center;
  padding: max(22px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: #eee6d9f5;
}
.reference figure { width: 100%; height: 100%; min-height: 0; margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.reference img { display: block; width: 100%; height: 100%; object-fit: contain; }
.reference figcaption { color: var(--muted); text-align: center; font-size: .875rem; padding: 12px 0 0; }
.reference button {
  position: absolute;
  top: max(var(--edge), env(safe-area-inset-top));
  right: max(var(--edge), env(safe-area-inset-right));
  display: grid;
  place-items: center;
  width: 43px;
  height: 43px;
}
.reference button:hover { background: #fff9ee; }
@media (max-width: 560px) {
  .toolstrip {
    right: 50%;
    transform: translateX(50%);
  }
  .follow-panel {
    right: var(--edge);
    bottom: calc(max(var(--edge), env(safe-area-inset-bottom)) + 54px);
    max-width: fit-content;
  }
  .more-actions { left: 0; right: auto; }
}
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<main aria-label="大屋圖 · 三维场景">
  <section class="stage" id="stage" aria-label="场景">
    <div id="viewport" class="viewport">
      <div class="loading" id="loading" role="status"><span class="spinner" aria-hidden="true"></span>正在加载三维场景</div>
    </div>
    <div id="follow-panel" class="follow-panel" hidden>
      <div><strong id="follow-name"></strong><span id="follow-action"></span></div>
      <button id="next-person" type="button">换一位</button>
    </div>
    <div class="toolstrip" role="group" aria-label="场景操作">
      <button id="reset" type="button" aria-pressed="true">原构图</button>
      <button id="room" type="button" aria-pressed="false">住户</button>
      <button id="garden" type="button" aria-pressed="false">庭院</button>
      <button id="pause" type="button" title="暂停场景动效" aria-label="暂停场景动效" aria-pressed="false">
        <svg viewBox="0 0 24 24" class="icon-pause" aria-hidden="true"><path d="M9 5.5v13m6-13v13"/></svg>
        <svg viewBox="0 0 24 24" class="icon-play" aria-hidden="true"><path d="M8 5.5 18 12 8 18.5Z"/></svg>
      </button>
      <details id="more" class="more">
        <summary aria-label="更多操作" title="更多操作" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </summary>
        <div class="more-actions">
          <button id="compare" type="button">查看原作</button>
          <button id="follow" type="button">跟拍</button>
          <button id="full" type="button" aria-pressed="false">进入全屏</button>
        </div>
      </details>
    </div>
    <p class="sr-only" id="view-label" aria-live="polite">原构图</p>
